[project]
name = "extraction"
version = "0.1.0"
description = "Single-pass typed extraction model (Clairic-style) and evaluation harness"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.1.0",
    "numpy>=2.4.6",
    "requests>=2.34.2",
    "safetensors>=0.8.0",
    "scipy>=1.17.1",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["extraction"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
]
